name: Test custom output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal cliff.toml config
        run: |
          cat > cliff.toml << 'EOF'
          [changelog]
          header = "# Changelog\n"
          body = """
          {% if version %}\
              ## [{{ version | replace(from="v", to="") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
          {% else %}\
              ## [unreleased]
          {% endif %}\
          {% for group, commits in commits | group_by(attribute="group") %}
              ### {{ group | upper_first }}
              {% for commit in commits %}
                  - {{ commit.message | upper_first }}\
              {% endfor %}
          {% endfor %}\n
          """
          trim = true
          footer = "<!-- generated by git-cliff -->\n"

          [git]
          conventional_commits = true
          EOF

      - name: Make a test commit so git-cliff has history to process
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          echo "test" > test-file.txt
          git add test-file.txt
          git commit -m "feat: add test file for git-cliff"

      - id: action
        uses: .
        with:
          config: cliff.toml
          args: "-v --output=CUSTOM_CHANGELOG.md"

      - name: Assert changelog output points to custom file
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog output: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: expected changelog output to be set"
            exit 1
          fi
          echo "PASS: changelog output is set to $CHANGELOG"

      - name: Assert custom changelog file exists
        run: |
          echo "Checking for custom changelog file: CUSTOM_CHANGELOG.md"
          if [ ! -f "CUSTOM_CHANGELOG.md" ]; then
            echo "FAIL: custom changelog file CUSTOM_CHANGELOG.md does not exist"
            exit 1
          fi
          echo "PASS: custom changelog file exists"
          cat CUSTOM_CHANGELOG.md
