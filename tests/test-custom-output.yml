name: Test custom output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        with:
          config: "tests/fixtures/cliff.toml"
          args: "--verbose --strip footer --tag 0.3.0 --output tests/fixtures/CUSTOM_CHANGELOG.md"

      - name: Assert changelog output points to custom file
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog path: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: changelog output is empty"
            exit 1
          fi
          echo "PASS: changelog output path is '$CHANGELOG'"

      - name: Assert custom changelog file exists
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "Checking file: $CHANGELOG"
          if [ ! -f "$CHANGELOG" ]; then
            echo "FAIL: custom changelog file does not exist at '$CHANGELOG'"
            exit 1
          fi
          echo "PASS: custom changelog file exists"

      - name: Assert content output is non-empty
        env:
          CONTENT: ${{ steps.action.outputs.content }}
        run: |
          echo "content length: ${#CONTENT}"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: content output is empty"
            exit 1
          fi
          echo "PASS: content output is non-empty"
