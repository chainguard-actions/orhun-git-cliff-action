name: Test specific git-cliff version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user and create conventional commits
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create conventional commits so git-cliff has something to process
          git commit --allow-empty -m "feat: add specific version feature"
          git commit --allow-empty -m "chore: update dependencies"

      - id: action
        uses: .
        with:
          version: "v2.7.0"
          config: "action/fixtures/cliff.toml"
          args: "-v --unreleased --output=CHANGELOG.md"

      - name: Assert changelog output is set
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog path: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: changelog output is empty"
            exit 1
          fi
          echo "PASS: changelog output is set to '$CHANGELOG'"

      - name: Assert changelog file exists
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "Checking file: $CHANGELOG"
          if [ ! -f "$CHANGELOG" ]; then
            echo "FAIL: changelog file does not exist at '$CHANGELOG'"
            exit 1
          fi
          echo "PASS: changelog file exists"
          cat "$CHANGELOG"
