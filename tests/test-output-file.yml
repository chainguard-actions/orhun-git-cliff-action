name: Test custom output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal cliff.toml config
        run: |
          cat > cliff.toml << 'EOF'
          [changelog]
          header = "# Changelog\n"
          body = """
          {% if version %}\
              ## [{{ version | replace(from="v", to="") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
          {% else %}\
              ## [unreleased]
          {% endif %}\
          {% for group, commits in commits | group_by(attribute="group") %}
              ### {{ group | upper_first }}
              {% for commit in commits %}
                  - {{ commit.message | upper_first }}\
              {% endfor %}
          {% endfor %}\n
          """
          trim = true
          footer = "<!-- generated by git-cliff -->\n"

          [git]
          conventional_commits = true
          EOF

      - id: action
        uses: .
        with:
          args: "-v --unreleased --output=my-custom-changelog.md"

      - name: Assert changelog output path matches custom file
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog path: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: changelog output is empty"
            exit 1
          fi
          if [ "$CHANGELOG" != "my-custom-changelog.md" ]; then
            echo "FAIL: expected changelog path 'my-custom-changelog.md', got '$CHANGELOG'"
            exit 1
          fi
          echo "PASS: changelog output path is correct"

      - name: Assert custom changelog file exists
        run: |
          if [ ! -f "my-custom-changelog.md" ]; then
            echo "FAIL: custom changelog file does not exist"
            exit 1
          fi
          echo "PASS: custom changelog file exists"
          cat my-custom-changelog.md
