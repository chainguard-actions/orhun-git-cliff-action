name: Test content output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal cliff.toml config
        run: |
          cat > cliff.toml << 'EOF'
          [changelog]
          header = "# Changelog\n"
          body = """
          {% if version %}\
              ## [{{ version | replace(from="v", to="") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
          {% else %}\
              ## [unreleased]
          {% endif %}\
          {% for group, commits in commits | group_by(attribute="group") %}
              ### {{ group | upper_first }}
              {% for commit in commits %}
                  - {{ commit.message | upper_first }}\
              {% endfor %}
          {% endfor %}\n
          """
          trim = true
          footer = "<!-- generated by git-cliff -->\n"

          [git]
          conventional_commits = true
          EOF

      - name: Create a test commit for changelog content
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        with:
          args: "-v"

      - name: Assert content output is populated
        env:
          CONTENT: ${{ steps.action.outputs.content }}
        run: |
          echo "content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: content output is empty"
            exit 1
          fi
          echo "PASS: content output is populated"

      - name: Assert content contains changelog header
        env:
          CONTENT: ${{ steps.action.outputs.content }}
        run: |
          echo "content: $CONTENT"
          if ! echo "$CONTENT" | grep -q "Changelog"; then
            echo "FAIL: content does not contain 'Changelog'"
            exit 1
          fi
          echo "PASS: content contains 'Changelog'"
