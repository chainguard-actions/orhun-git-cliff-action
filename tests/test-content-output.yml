name: Test changelog content output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and cliff.toml
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          cp "$GITHUB_WORKSPACE/tests/fixtures/cliff.toml" "$GITHUB_WORKSPACE/cliff.toml"
          # Create a conventional commit so git-cliff has unreleased content
          echo "test" >> test-file.txt
          git add test-file.txt
          git commit -m "feat: add test feature for content output"

      - id: action
        uses: .
        with:
          args: "-v --unreleased"

      - name: Assert content output is set
        env:
          CONTENT: ${{ steps.action.outputs.content }}
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog path: $CHANGELOG"
          echo "content:"
          echo "$CONTENT"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: changelog output is empty"
            exit 1
          fi
          # Content should match the file
          FILE_CONTENT="$(cat "$CHANGELOG")"
          if [ -z "$FILE_CONTENT" ]; then
            echo "FAIL: changelog file is empty"
            exit 1
          fi
          if [ -z "$CONTENT" ]; then
            echo "FAIL: content output is empty"
            exit 1
          fi
          echo "PASS: content output is populated"
