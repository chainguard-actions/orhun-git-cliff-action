name: Test github_token input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: action
        uses: .
        with:
          args: "-v --current"
          github_token: ${{ github.token }}
      - name: Assert content output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.content }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty content output"
            exit 1
          fi
          echo "PASS"
