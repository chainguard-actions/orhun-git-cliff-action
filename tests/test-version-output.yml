name: Test version output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config and create commits for changelog
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git commit --allow-empty -m "feat: initial release feature"

      - id: action
        uses: .
        with:
          config: "tests/fixtures/cliff.toml"
          args: "-v --unreleased --tag v1.0.0"

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "FAIL: version output is empty or null"
            exit 1
          fi
          echo "PASS: version output is set to $VERSION"

      - name: Assert changelog output is set
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: changelog output is empty"
            exit 1
          fi
          echo "PASS: changelog output is set"

      - name: Assert content output is set
        env:
          CONTENT: ${{ steps.action.outputs.content }}
        run: |
          echo "content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: content output is empty"
            exit 1
          fi
          echo "PASS: content output is set"
