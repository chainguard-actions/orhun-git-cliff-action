name: Test version output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal cliff.toml config
        run: |
          cat > cliff.toml << 'EOF'
          [changelog]
          header = "# Changelog\n"
          body = """
          {% if version %}\
              ## [{{ version | replace(from="v", to="") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
          {% else %}\
              ## [unreleased]
          {% endif %}\
          {% for group, commits in commits | group_by(attribute="group") %}
              ### {{ group | upper_first }}
              {% for commit in commits %}
                  - {{ commit.message | upper_first }}\
              {% endfor %}
          {% endfor %}\n
          """
          trim = true
          footer = "<!-- generated by git-cliff -->\n"

          [git]
          conventional_commits = true
          EOF

      - name: Create a test tag for version detection
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git tag v0.1.0 HEAD

      - id: action
        uses: .
        with:
          args: "-v --latest"

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "FAIL: version output is empty or null"
            exit 1
          fi
          echo "PASS: version output is set to $VERSION"
