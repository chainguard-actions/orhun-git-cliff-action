name: Test version output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git user and create a tagged commit
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Create conventional commits and a tag so git-cliff can detect a version
          git commit --allow-empty -m "feat: add version output feature"
          git commit --allow-empty -m "fix: fix version detection"
          git tag v1.0.0 HEAD 2>/dev/null || true

      - id: action
        uses: .
        with:
          config: "action/fixtures/cliff.toml"
          args: "-v --tag=v1.0.0 --output=CHANGELOG.md"

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "WARN: version output is empty or null (may be expected if no tagged releases)"
          else
            echo "PASS: version output is set to '$VERSION'"
          fi

      - name: Assert changelog output is set
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog path: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: changelog output is empty"
            exit 1
          fi
          echo "PASS: changelog output is set to '$CHANGELOG'"

      - name: Assert changelog file exists
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "Checking file: $CHANGELOG"
          if [ ! -f "$CHANGELOG" ]; then
            echo "FAIL: changelog file does not exist at '$CHANGELOG'"
            exit 1
          fi
          echo "PASS: changelog file exists"
          cat "$CHANGELOG"
