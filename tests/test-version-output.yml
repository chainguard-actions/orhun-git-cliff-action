name: Test version output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"

      - id: action
        uses: .
        with:
          config: "tests/fixtures/cliff.toml"
          args: "--verbose --strip footer --tag 1.0.0"
        env:
          OUTPUT: "tests/fixtures/CHANGELOG-version.md"

      - name: Assert version output is set
        env:
          VERSION: ${{ steps.action.outputs.version }}
        run: |
          echo "version: $VERSION"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "WARN: version output is empty or null (may be expected if no matching commits)"
          else
            echo "PASS: version output is '$VERSION'"
          fi

      - name: Assert changelog output is set
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "changelog: $CHANGELOG"
          if [ -z "$CHANGELOG" ]; then
            echo "FAIL: changelog output is empty"
            exit 1
          fi
          echo "PASS: changelog output is '$CHANGELOG'"

      - name: Assert changelog file exists on disk
        env:
          CHANGELOG: ${{ steps.action.outputs.changelog }}
        run: |
          echo "Checking file: $CHANGELOG"
          if [ ! -f "$CHANGELOG" ]; then
            echo "FAIL: changelog file does not exist at '$CHANGELOG'"
            exit 1
          fi
          echo "PASS: changelog file exists"

      - name: Assert content output is non-empty
        env:
          CONTENT: ${{ steps.action.outputs.content }}
        run: |
          echo "content length: ${#CONTENT}"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: content output is empty"
            exit 1
          fi
          echo "PASS: content output is non-empty"
