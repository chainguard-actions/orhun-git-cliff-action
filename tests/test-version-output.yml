name: Test version output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create a minimal cliff.toml config
        run: |
          cat > cliff.toml << 'EOF'
          [changelog]
          header = "# Changelog\n"
          body = """
          {% if version %}\
              ## [{{ version | replace(from="v", to="") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
          {% else %}\
              ## [unreleased]
          {% endif %}\
          {% for group, commits in commits | group_by(attribute="group") %}
              ### {{ group | upper_first }}
              {% for commit in commits %}
                  - {{ commit.message | upper_first }}\
              {% endfor %}
          {% endfor %}\n
          """
          trim = true
          footer = "<!-- generated by git-cliff -->\n"

          [git]
          conventional_commits = true
          EOF

      - id: action
        uses: .
        with:
          config: cliff.toml
          args: -v --output git-cliff/CHANGELOG.md

      - name: Assert version output is set (may be null if no tags)
        env:
          VERSION: ${{ steps.action.outputs.version }}
          CONTENT: ${{ steps.action.outputs.content }}
        run: |
          echo "version output: $VERSION"
          echo "content output: $CONTENT"
          # The version output is set from the latest tag; it may be "null" if no tags exist.
          # Either way, the output key must be present (even if empty/null).
          # The content must be non-empty since there are commits.
          if [ -z "$CONTENT" ]; then
            echo "FAIL: expected content output to be non-empty"
            exit 1
          fi
          echo "PASS: version and content outputs are present"
